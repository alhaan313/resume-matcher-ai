<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume ATS Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}" class="active">Upload</a>
        <a href="{{ url_for('history') }}">History</a>
    </nav>
    
    <div class="container">
        <h1>📄 Resume ATS Checker</h1>
        
        <form action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="resume">Upload Your Resume (PDF)</label>
                <input type="file" id="resume" name="resume" accept=".pdf" required>
            </div>
            
            <div class="form-group">
                <label for="job_description">Job Description (Optional)</label>
                <textarea id="job_description" name="job_description" rows="4" 
                    placeholder="Paste job description here..."></textarea>
            </div>
            
            <button type="submit" class="btn-primary">🔍 Analyze Resume</button>
        </form>
    </div>
</body>
</html>
